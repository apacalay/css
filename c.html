
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CoC Link Converter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 600px;

            margin-top: 30px;

            background: white;

            padding: 24px;

            border-radius: 16px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 8px;

            font-size: 24px;

            text-align: center;
        }

        .description {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 22px;
        }


        /* INPUT */

        .input-wrapper {
            position: relative;

            width: 100%;
        }

        .input-wrapper input {
            width: 100%;

            height: 52px;

            padding: 0 52px 0 15px;

            border: 1px solid #d1d5db;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #6366f1;

            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }


        /* PASTE ICON */

        .paste-button {
            position: absolute;

            right: 6px;
            top: 6px;

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 9px;

            background: #f0f0f0;

            cursor: pointer;

            font-size: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;
        }

        .paste-button:hover {
            background: #e5e5e5;
        }

        .paste-button:active {
            transform: scale(0.92);
        }


        /* RESULT */

        #result {
            display: none;

            margin-top: 20px;

            padding: 16px;

            border-radius: 12px;

            background: #f7f7f7;

            border: 1px solid #e5e5e5;
        }

        .result-title {
            font-size: 14px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .result-link {
            display: block;

            padding: 12px;

            background: white;

            border-radius: 9px;

            border: 1px solid #ddd;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            line-height: 1.5;

            word-break: break-all;
        }

        .result-link:hover {
            text-decoration: underline;
        }


        /* COPY BUTTON */

        .copy-button {
            width: 100%;

            margin-top: 10px;

            height: 45px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        .copy-button:active {
            transform: scale(0.98);
        }


        /* ERROR */

        .error {
            color: #dc2626;

            font-size: 14px;
        }


        /* MOBILE */

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .container {
                margin-top: 10px;

                padding: 20px;

                border-radius: 14px;
            }

            h2 {
                font-size: 21px;
            }

            .description {
                font-size: 13px;
            }

            .input-wrapper input {
                height: 50px;

                font-size: 14px;
            }

            .result-link {
                font-size: 13px;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <h2>⚔️ CoC Link Converter</h2>

    <div class="description">
        Paste link Clash of Clans untuk membuka dengan Atrasis Ultimate
    </div>


    <!-- INPUT -->

    <div class="input-wrapper">

        <input
            type="text"
            id="cocLink"
            placeholder="Paste Clash of Clans link..."
            autocomplete="off"
        >

        <button
            class="paste-button"
            onclick="pasteLink()"
            title="Paste"
            aria-label="Paste link"
        >
            📋
        </button>

    </div>


    <!-- RESULT -->

    <div id="result"></div>

</div>


<script>

const input = document.getElementById("cocLink");
const result = document.getElementById("result");


/*
    PASTE DARI TOMBOL
*/

async function pasteLink() {

    try {

        const text = await navigator.clipboard.readText();

        if (!text) {

            showError("Clipboard kosong.");

            return;
        }

        input.value = text;

        processLink();

    } catch (error) {

        showError(
            "Tidak bisa membaca clipboard. Silakan paste manual."
        );

    }

}


/*
    PROSES LINK
*/

function processLink() {

    const inputValue = input.value.trim();


    if (!inputValue) {

        result.style.display = "none";

        return;
    }


    try {

        const url = new URL(inputValue);


        /*
            Pastikan link Clash of Clans
        */

        if (
            !url.hostname.includes("link.clashofclans.com")
        ) {

            showError(
                "Link bukan link Clash of Clans."
            );

            return;
        }


        /*
            Ambil query

            Contoh:

            ?action=OpenLayout&id=TH18%3AHV...

            menjadi:

            action=OpenLayout&id=TH18%3AHV...
        */

        const query = url.search.substring(1);


        if (!query) {

            showError("Format link tidak valid.");

            return;
        }


        /*
            Ubah menjadi Atrasis Ultimate
        */

        const newLink =
            "atrasis-ultimate://" + query;


        /*
            Tampilkan result
        */

        result.style.display = "block";

        result.innerHTML = `

            <div class="result-title">
                Result
            </div>

            <a
                class="result-link"
                href="${newLink}"
            >
                ${newLink}
            </a>

            <button
                class="copy-button"
                onclick="copyResult('${escapeForJS(newLink)}')"
            >
                📋 Copy Link
            </button>

        `;


    } catch (error) {

        showError(
            "Format link tidak valid."
        );

    }

}


/*
    COPY RESULT
*/

async function copyResult(link) {

    try {

        await navigator.clipboard.writeText(link);

        const button =
            document.querySelector(".copy-button");

        button.innerText = "✓ Copied!";


        setTimeout(() => {

            button.innerText = "📋 Copy Link";

        }, 1500);


    } catch (error) {

        alert("Gagal menyalin link.");

    }

}


/*
    ERROR
*/

function showError(message) {

    result.style.display = "block";

    result.innerHTML = `
        <div class="error">
            ⚠️ ${message}
        </div>
    `;

}


/*
    Escape sederhana untuk onclick
*/

function escapeForJS(text) {

    return text
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");

}


/*
    JIKA USER PASTE MANUAL
    DENGAN CTRL + V
*/

input.addEventListener("paste", function() {

    setTimeout(() => {

        processLink();

    }, 100);

});


/*
    JIKA USER MENGETIK / MENGUBAH INPUT
*/

input.addEventListener("input", function() {

    // Bisa diaktifkan kalau ingin
    // langsung memproses saat mengetik.

});

</script>

</body>
</html>
