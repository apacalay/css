
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>COC Link Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1000px;
      margin: auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideIn 0.6s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h2 { 
      text-align: left; 
      color: #333;
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .dark-mode-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .dark-mode-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .dark-mode-btn.dark {
      background: linear-gradient(135deg, #f39c12, #e67e22);
    }
    
    @keyframes glow {
      from { 
        filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.3));
      }
      to { 
        filter: drop-shadow(0 0 15px rgba(118, 75, 162, 0.5));
      }
    }
    
    label {
      font-weight: 600;
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #555;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    
    label:hover {
      color: #667eea;
      transform: translateX(5px);
    }
    
    input[type="text"], input[type="number"], input[type="datetime-local"], select, textarea {
      width: 100%;
      padding: 15px;
      font-size: 14px;
      border: 2px solid #e1e5e9;
      border-radius: 12px;
      resize: vertical;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: rgba(255, 255, 255, 0.9);
    }
    
    input[type="text"]:focus, input[type="number"]:focus, input[type="datetime-local"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    input[type="text"]:hover, input[type="number"]:hover, input[type="datetime-local"]:hover, select:hover, textarea:hover {
      border-color: #667eea;
    }
    
    #output:hover {
      border-color: rgba(102, 126, 234, 0.4);
      transform: none;
    }
    
    textarea { 
      font-family: 'Monaco', 'Menlo', monospace; 
      min-height: 120px; 
      line-height: 1.5;
    }
    
    .checkbox-group {
      margin-top: 20px;
      padding: 15px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    .checkbox-group label {
      display: flex;
      align-items: center;
      font-weight: 500;
      color: #555;
      gap: 10px;
      margin: 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .checkbox-group label:hover {
      color: #667eea;
      transform: none;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
    }
    
    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-weight: 600;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      cursor: pointer;
      margin-top: 25px;
      width: 100%;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    
    button:hover::before {
      left: 100%;
    }
    
    button:hover { 
      background: linear-gradient(135deg, #764ba2, #667eea);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }
    
    button:active {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
    
    .footer-note {
      font-size: 14px;
      color: #888;
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    .tabs {
      display: flex;
      margin-bottom: 30px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      padding: 5px;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    .tab {
      flex: 1;
      text-align: center;
      padding: 15px;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      border-radius: 8px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
      transition: left 0.3s ease;
    }
    
    .tab:hover::before {
      left: 100%;
    }
    
    .tab:hover {
      color: #667eea;
      transform: translateY(-2px);
    }
    
    .tab.active {
      color: white;
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      transform: translateY(-2px);
    }
    
    .tab-content {
      display: none;
      animation: fadeIn 0.5s ease-out;
    }
    
    .tab-content.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .output-section {
      margin-top: 30px;
      padding: 20px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    .output-section label {
      color: #667eea;
      font-weight: 700;
      font-size: 1.1rem;
    }
    
    #output {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(102, 126, 234, 0.2);
      font-size: 13px;
      line-height: 1.6;
      cursor: text;
      transition: border-color 0.2s ease;
    }
    
    #output:hover {
      border-color: rgba(102, 126, 234, 0.4);
    }
    
    #output:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .icon {
      margin-right: 8px;
      color: #667eea;
    }

    /* Time Calculator Styles */
    .input-group {
      margin-bottom: 25px;
    }

    .input-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .input-row input, .input-row select {
      flex: 1;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button.secondary {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
    }

    button.secondary:hover {
      background: linear-gradient(135deg, #7f8c8d, #95a5a6);
    }

    button.success {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
    }

    button.success:hover {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
    }

    #result {
      margin: 25px 0;
      padding: 20px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(102, 126, 234, 0.1);
      font-size: 16px;
      line-height: 1.6;
      animation: fadeIn 0.5s ease-out;
    }

    .countdown {
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      color: #667eea;
      margin: 10px 0;
      padding: 12px;
      background: rgba(102, 126, 234, 0.1);
      border-radius: 8px;
      border: 1px solid rgba(102, 126, 234, 0.2);
    }

    .timezone-info {
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0;
      border-left: 3px solid #667eea;
      font-size: 12px;
    }

    #api-results {
      margin-top: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.85));
      border-radius: 10px;
      border-left: 4px solid #667eea;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(5px);
    }

    #api-results div {
      margin: 0;
      padding: 6px 12px;
      background: transparent;
      border-radius: 0;
      border-left: none;
      font-size: 13px;
      line-height: 1.4;
      animation: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      transition: none;
      backdrop-filter: none;
    }

    .username {
      width: 110px;
      font-weight: 600;
      color: #667eea;
      flex-shrink: 0;
      font-size: 13px;
      letter-spacing: 0.2px;
      margin-right: 12px;
    }

    .content {
      flex: 1;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #667eea;
      font-size: 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.8));
      border-radius: 15px;
      border: 1px solid rgba(102, 126, 234, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .loading i {
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: rgba(231, 76, 60, 0.1) !important;
      border-left-color: #e74c3c !important;
      color: #c0392b;
    }

    .success {
      background: rgba(46, 204, 113, 0.1) !important;
      border-left-color: #27ae60 !important;
      color: #27ae60;
    }

    .warning {
      background: rgba(52, 152, 219, 0.1) !important;
      border-left-color: #3498db !important;
      color: #2980b9;
    }

    /* Dark Mode Styles - June Update: Dark Days Theme */
    body.dark-mode {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      color: #ffffff;
    }

    body.dark-mode .container {
      background: rgba(26, 26, 26, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    body.dark-mode h2 {
      color: #ffffff;
      background: linear-gradient(135deg, #ffffff, #e0e0e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    body.dark-mode h3 {
      color: #87ceeb;
      border-bottom-color: rgba(135, 206, 235, 0.3);
    }

    body.dark-mode label {
      color: #e0e0e0;
    }

    body.dark-mode label:hover {
      color: #87ceeb;
    }

    body.dark-mode input[type="text"], 
    body.dark-mode input[type="number"], 
    body.dark-mode input[type="datetime-local"], 
    body.dark-mode select, 
    body.dark-mode textarea {
      background: rgba(40, 40, 40, 0.9);
      border-color: #555555;
      color: #ffffff;
    }

    body.dark-mode input[type="text"]:focus, 
    body.dark-mode input[type="number"]:focus, 
    body.dark-mode input[type="datetime-local"]:focus, 
    body.dark-mode select:focus, 
    body.dark-mode textarea:focus {
      border-color: #00bfff;
      box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.2);
    }

    body.dark-mode input[type="text"]:hover, 
    body.dark-mode input[type="number"]:hover, 
    body.dark-mode input[type="datetime-local"]:hover, 
    body.dark-mode select:hover, 
    body.dark-mode textarea:hover {
      border-color: #00bfff;
    }

    body.dark-mode .checkbox-group {
      background: rgba(0, 191, 255, 0.1);
      border-color: rgba(0, 191, 255, 0.2);
    }

    body.dark-mode .checkbox-group label {
      color: #e0e0e0;
    }

    body.dark-mode .checkbox-group label:hover {
      color: #00bfff;
    }

    body.dark-mode .tabs {
      background: rgba(30, 58, 95, 0.2);
      border-color: rgba(74, 144, 226, 0.3);
    }

    body.dark-mode .tab {
      color: #87ceeb;
    }

    body.dark-mode .tab:hover {
      color: #4a90e2;
    }

    body.dark-mode .tab.active {
      color: white;
      background: linear-gradient(135deg, #1e3a5f, #2d5a8b);
    }

    body.dark-mode .output-section {
      background: rgba(0, 191, 255, 0.1);
      border-color: rgba(0, 191, 255, 0.2);
    }

    body.dark-mode .output-section label {
      color: #00bfff;
    }

    body.dark-mode #output {
      background: rgba(40, 40, 40, 0.9);
      border-color: rgba(0, 191, 255, 0.3);
      color: #ffffff;
    }

    body.dark-mode .input-group {
      background: rgba(0, 191, 255, 0.1);
      border-color: rgba(0, 191, 255, 0.2);
    }

    body.dark-mode #result {
      background: rgba(0, 191, 255, 0.1);
      border-color: rgba(0, 191, 255, 0.2);
    }

    body.dark-mode .countdown {
      background: rgba(0, 191, 255, 0.2);
      border-color: rgba(0, 191, 255, 0.3);
      color: #00bfff;
    }

    body.dark-mode .timezone-info {
      background: rgba(40, 40, 40, 0.9);
      border-left-color: #00bfff;
      color: #e0e0e0;
    }

    body.dark-mode #api-results {
      background: linear-gradient(135deg, rgba(26, 26, 26, 0.95), rgba(40, 40, 40, 0.85));
      border-left-color: #00bfff;
    }

    body.dark-mode .loading {
      background: linear-gradient(135deg, rgba(26, 26, 26, 0.9), rgba(40, 40, 40, 0.8));
      border-color: rgba(0, 191, 255, 0.2);
      color: #00bfff;
    }

    body.dark-mode .footer-note {
      background: rgba(0, 191, 255, 0.1);
      border-color: rgba(0, 191, 255, 0.2);
      color: #e0e0e0;
    }

    body.dark-mode .username {
      color: #00bfff;
    }

    body.dark-mode .error {
      background: rgba(255, 0, 0, 0.2) !important;
      border-left-color: #ff0000 !important;
      color: #ff0000;
    }

    body.dark-mode .success {
      background: rgba(0, 191, 255, 0.2) !important;
      border-left-color: #00bfff !important;
      color: #00bfff;
    }

    body.dark-mode .warning {
      background: rgba(255, 165, 0, 0.2) !important;
      border-left-color: #ffa500 !important;
      color: #ffa500;
    }

    /* Dark Mode Button Styles - Dark Teal Theme */
    body.dark-mode button {
      background: linear-gradient(135deg, #1e3a5f, #2d5a8b);
      color: #87ceeb;
      border-color: #4a90e2;
    }

    body.dark-mode button:hover {
      background: linear-gradient(135deg, #2d5a8b, #1e3a5f);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(74, 144, 226, 0.3);
    }

    body.dark-mode button:active {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
    }

    body.dark-mode button.secondary {
      background: linear-gradient(135deg, #4a5568, #2d3748);
    }

    body.dark-mode button.secondary:hover {
      background: linear-gradient(135deg, #2d3748, #1a202c);
    }

    body.dark-mode button.success {
      background: linear-gradient(135deg, #1e3a5f, #2d5a8b);
    }

    body.dark-mode button.success:hover {
      background: linear-gradient(135deg, #2d5a8b, #1e3a5f);
    }

    body.dark-mode .dark-mode-btn {
      background: linear-gradient(135deg, #1e3a5f, #2d5a8b);
    }

    body.dark-mode .dark-mode-btn:hover {
      background: linear-gradient(135deg, #2d5a8b, #1e3a5f);
    }

    body.dark-mode .dark-mode-btn.dark {
      background: linear-gradient(135deg, #e6a23c, #d69e2e);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        margin: 10px;
      }
      
      h2 {
        font-size: 2rem;
      }
      
      .tabs {
        flex-direction: column;
        gap: 5px;
      }
      
      .tab {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h2><i class="fas fa-crown icon"></i>Clash of Clans</h2>
      <button id="dark-mode-toggle" class="dark-mode-btn" onclick="toggleDarkMode()">
        <i class="fas fa-moon"></i>
      </button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('manual')">
        <i class="fas fa-edit icon"></i>Input Manual
      </div>
      <div class="tab" onclick="switchTab('youtube')">
        <i class="fab fa-youtube icon"></i>Ambil dari YouTube
      </div>
      <div class="tab" onclick="switchTab('time')">
        <i class="fas fa-clock icon"></i>Selisih Waktu
      </div>
    </div>

    <!-- TAB MANUAL -->
    <div id="tab-manual" class="tab-content active">
      <label for="judul"><i class="fas fa-heading icon"></i>Judul Output:</label>
      <input type="text" id="judul" placeholder="Contoh: BEST TH14 WAR BASE">

      <label for="nomor"><i class="fas fa-hashtag icon"></i>Nomor Awal:</label>
      <input type="number" id="nomor" value="1">

      <label for="manualSource"><i class="fas fa-link icon"></i>Link Sumber:</label>
      <input type="text" id="manualSource" placeholder="https://www.youtube.com/watch?v=xxxxxxx">

      <div class="checkbox-group">
        <label><input type="checkbox" id="hapusYT"> <i class="fas fa-trash icon"></i>Hapus Link Sumber</label>
      </div>

      <label for="input"><i class="fas fa-list icon"></i>Masukkan Link-Link (satu per baris):</label>
      <textarea id="input" placeholder="Paste link YouTube redirect atau base layout di sini..."></textarea>

      <button onclick="convert()">
        <i class="fas fa-magic icon"></i>Convert
      </button>
    </div>

    <!-- TAB YOUTUBE -->
    <div id="tab-youtube" class="tab-content">
      <label for="videoId"><i class="fab fa-youtube icon"></i>YouTube Video ID / Link:</label>
      <input type="text" id="videoId" autocomplete="off" placeholder="yqskXZ3ccXQ atau https://youtube.com/watch?v=...">

      <label for="judulYT"><i class="fas fa-heading icon"></i>Judul Output:</label>
      <input type="text" id="judulYT" placeholder="(Otomatis jika kosong)">

      <label for="nomorYT"><i class="fas fa-hashtag icon"></i>Nomor Awal:</label>
      <input type="number" id="nomorYT" value="1">

      <div class="checkbox-group">
        <label><input type="checkbox" id="hapusYTYT"> <i class="fas fa-trash icon"></i>Hapus Link Sumber</label>
      </div>

      <button onclick="grabFromYouTube()">
        <i class="fas fa-download icon"></i>Ambil dari YouTube
      </button>
    </div>

    <!-- TAB TIME -->
    <div id="tab-time" class="tab-content">
      <div class="input-group">
        <label for="datetime"><i class="fas fa-calendar-alt icon"></i>Masukkan waktu UTC:</label>
        <div class="input-row">
          <input type="datetime-local" id="datetime" step="1">
          <select id="timezone">
            <option value="UTC">UTC</option>
            <option value="WIB">WIB (UTC+7)</option>
            <option value="WITA">WITA (UTC+8)</option>
            <option value="WIT">WIT (UTC+9)</option>
            <option value="EST">EST (UTC-5)</option>
            <option value="PST">PST (UTC-8)</option>
          </select>
        </div>
        <div class="button-group">
          <button onclick="hitungSelisih()">
            <i class="fas fa-calculator icon"></i>Hitung Selisih
          </button>
          <button onclick="setCurrentTime()" class="secondary">
            <i class="fas fa-clock icon"></i>Waktu Sekarang
          </button>
          <button onclick="startCountdown()" class="success">
            <i class="fas fa-hourglass-start icon"></i>Countdown
          </button>
        </div>
      </div>

      <div id="result"></div>
      <div id="countdown" class="countdown" style="display: none;"></div>
      <div id="clear-buttons" style="display: none; margin-top: 15px; text-align: center;">
        <button onclick="clearResults()" class="secondary" style="width: auto; padding: 8px 16px; font-size: 12px;">
          <i class="fas fa-times icon"></i>Hapus Hasil
        </button>
      </div>

      <h3><i class="fas fa-database icon"></i>Selisih LastUpdated (dari API ClashChamps)</h3>
      <div id="api-results">
        <div class="loading">
          <i class="fas fa-spinner"></i>Memuat data...
        </div>
      </div>
    </div>

    <div id="output-section" class="output-section">
      <label for="output"><i class="fas fa-code icon"></i>Hasil Output:</label>
      <textarea id="output" readonly placeholder="Hasil akan muncul di sini..."></textarea>
    </div>

    <div class="footer-note">
      <i class="fas fa-heart" style="color: #e74c3c;"></i> Made with ❤️
    </div>
  </div>

  <script>
    const apiKey = "AIzaSyCVns3Lh4xYBWNgOYeB8LQ5oMLOfL7u6Yw";

    // Dark Mode Functions
    function toggleDarkMode() {
      const body = document.body;
      const toggleBtn = document.getElementById('dark-mode-toggle');
      const icon = toggleBtn.querySelector('i');
      
      if (body.classList.contains('dark-mode')) {
        body.classList.remove('dark-mode');
        toggleBtn.classList.remove('dark');
        icon.className = 'fas fa-moon';
        localStorage.setItem('darkMode', 'false');
      } else {
        body.classList.add('dark-mode');
        toggleBtn.classList.add('dark');
        icon.className = 'fas fa-sun';
        localStorage.setItem('darkMode', 'true');
      }
    }

    function initDarkMode() {
      const savedMode = localStorage.getItem('darkMode');
      const body = document.body;
      const toggleBtn = document.getElementById('dark-mode-toggle');
      const icon = toggleBtn.querySelector('i');
      
      if (savedMode === 'true') {
        body.classList.add('dark-mode');
        toggleBtn.classList.add('dark');
        icon.className = 'fas fa-sun';
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      let tabIndex;
      if (tab === 'manual') tabIndex = 1;
      else if (tab === 'youtube') tabIndex = 2;
      else if (tab === 'time') tabIndex = 3;
      
      document.querySelector(".tab:nth-child(" + tabIndex + ")").classList.add("active");
      document.getElementById("tab-" + tab).classList.add("active");
      
      // Show/hide output section based on tab
      const outputSection = document.getElementById("output-section");
      if (tab === 'time') {
        outputSection.style.display = 'none';
        setCurrentTime();
        ambilLastUpdated();
      } else {
        outputSection.style.display = 'block';
      }
    }

    function extractVideoId(raw) {
      const urlMatch = raw.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
      return urlMatch ? urlMatch[1] : raw.trim();
    }

    function cleanLinkOnly(rawLine) {
      const match = rawLine.match(/https:\/\/link\.clashofclans\.com\/[^\s]+/);
      return match ? match[0] : rawLine;
    }

    function extractRealLink(link) {
      try {
        const url = new URL(link);
        const realLink = url.searchParams.get("q");
        const videoID = url.searchParams.get("v");
        const finalLink = realLink || link;
        const ytLink = videoID ? `https://www.youtube.com/watch?v=${videoID}` : "";
        return { layoutLink: finalLink, youtubeLink: ytLink };
      } catch (e) {
        return { layoutLink: link, youtubeLink: "" };
      }
    }

    function convert() {
      const lines = document.getElementById("input").value.trim().split('\n');
      const judul = document.getElementById("judul").value.trim();
      const manualSource = document.getElementById("manualSource").value.trim();
      const hapusYT = document.getElementById("hapusYT").checked;
      let nomor = parseInt(document.getElementById("nomor").value);
      let hasil = "";

      lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        line = cleanLinkOnly(line);
        let layoutLink = "", youtubeLink = "";

        if (line.includes("youtube.com/redirect")) {
          const result = extractRealLink(line);
          layoutLink = result.layoutLink;
          youtubeLink = result.youtubeLink;
        } else if (line.includes("link.clashofclans.com")) {
          layoutLink = line;
          youtubeLink = manualSource;
        } else if (/^TH\d{2}:[A-Z]+:/.test(line)) {
          const encodedID = encodeURIComponent(line);
          layoutLink = `https://link.clashofclans.com/en?action=OpenLayout&id=${encodedID}`;
          youtubeLink = manualSource;
        } else {
          layoutLink = line;
          youtubeLink = manualSource;
        }

        if (hapusYT) youtubeLink = "";
        hasil += `${layoutLink}|||${judul}|||${nomor}.png|||${youtubeLink}\n`;
        nomor++;
      });

      document.getElementById("output").value = hasil.trim();
    }

    async function grabFromYouTube() {
      const rawInput = document.getElementById("videoId").value.trim();
      const videoId = extractVideoId(rawInput);
      const hapusYT = document.getElementById("hapusYTYT").checked;
      let nomor = parseInt(document.getElementById("nomorYT").value);
      const judulCustom = document.getElementById("judulYT").value.trim();

      if (!videoId) {
        alert("Masukkan ID atau URL video YouTube.");
        return;
      }

      const url = `https://www.googleapis.com/youtube/v3/videos?key=${apiKey}&part=snippet&id=${videoId}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const snippet = data.items[0].snippet;
        const deskripsi = snippet.description;
        const ytLink = `https://www.youtube.com/watch?v=${videoId}`;
        const title = judulCustom || snippet.title;

        const allLinks = deskripsi.match(/https:\/\/link\.clashofclans\.com\/[^\s]+/g);
        const baseLinks = allLinks ? allLinks.filter(link => link.includes("action=OpenLayout")) : [];

        if (baseLinks.length === 0) {
          alert("Tidak ditemukan link layout yang valid di deskripsi video.");
          return;
        }

        let hasil = "";
        baseLinks.forEach(link => {
          const youtubeLink = hapusYT ? "" : ytLink;
          hasil += `${link}|||${title}|||${nomor}.png|||${youtubeLink}\n`;
          nomor++;
        });

        document.getElementById("output").value = hasil.trim();
      } catch (err) {
        alert("Gagal mengambil data dari YouTube API");
      }
    }

    // Time Calculator Functions
    let countdownInterval;

    function formatSelisih(ms) {
      const detik = Math.floor(ms / 1000);
      const menit = Math.floor(detik / 60);
      const jam = Math.floor(menit / 60);
      const hari = Math.floor(jam / 24);
      return `${hari} hari, ${Math.abs(jam % 24)} jam, ${Math.abs(menit % 60)} menit, ${Math.abs(detik % 60)} detik`;
    }

    function setCurrentTime() {
      const timezone = document.getElementById("timezone").value;
      const now = new Date();
      
      if (timezone === "UTC") {
        // Set UTC time
        const utcDateTime = now.toISOString().slice(0, 19);
        document.getElementById("datetime").value = utcDateTime;
      } else {
        // Set time for selected timezone
        const timezoneOffsets = {
          "WIB": 7,    // WIB is UTC+7
          "WITA": 8,   // WITA is UTC+8
          "WIT": 9,    // WIT is UTC+9
          "EST": -5,   // EST is UTC-5
          "PST": -8    // PST is UTC-8
        };
        
        const offset = timezoneOffsets[timezone];
        const timezoneTime = new Date(now.getTime() + (offset * 60 * 60 * 1000));
        const timezoneDateTime = timezoneTime.toISOString().slice(0, 19);
        document.getElementById("datetime").value = timezoneDateTime;
      }
    }

    function startCountdown() {
      const input = document.getElementById("datetime").value;
      const timezone = document.getElementById("timezone").value;
      
      if (!input) {
        alert("Silakan masukkan waktu terlebih dahulu!");
        return;
      }

      // Parse input as if it's in the selected timezone (same logic as hitungSelisih)
      let targetTime;
      if (timezone === "UTC") {
        // For UTC, treat input as UTC time and convert to WIB
        targetTime = new Date(input + "Z");
        // Convert UTC to WIB (+7 hours)
        targetTime = new Date(targetTime.getTime() + (7 * 60 * 60 * 1000));
      } else {
        // For other timezones, treat input as if it's in that timezone
        // Since new Date(input) always treats input as local time,
        // we need to manually construct the date in the target timezone
        
        // Parse the input string to get components
        const [datePart, timePart] = input.split('T');
        const [year, month, day] = datePart.split('-').map(Number);
        const [hour, minute, second] = timePart.split(':').map(Number);
        
        // Create date object in target timezone
        // We'll create it as if it's in UTC, then adjust
        const targetOffsets = {
          "WIB": 7,    // WIB is UTC+7
          "WITA": 8,   // WITA is UTC+8
          "WIT": 9,    // WIT is UTC+9
          "EST": -5,   // EST is UTC-5
          "PST": -8    // PST is UTC-8
        };
        
        const targetOffset = targetOffsets[timezone];
        
        // Create UTC time by subtracting the timezone offset
        const utcHour = hour - targetOffset;
        const utcDate = new Date(Date.UTC(year, month - 1, day, utcHour, minute, second));
        
        // Convert to WIB
        targetTime = new Date(utcDate.getTime() + (7 * 60 * 60 * 1000));
      }
      
      const countdownDiv = document.getElementById("countdown");
      countdownDiv.style.display = "block";
      document.getElementById("clear-buttons").style.display = "block";

      function updateCountdown() {
        // Get current WIB time
        const nowUTC = new Date();
        const nowWIB = new Date(nowUTC.getTime() + (7 * 60 * 60 * 1000)); // UTC+7
        const diff = nowWIB - targetTime; // Same logic as hitungSelisih

        if (diff >= 0) {
          // Time has passed (same as "Di masa lalu")
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          
          countdownDiv.innerHTML = `
            <i class="fas fa-history icon"></i>
            Waktu telah lewat: ${days}d ${hours}h ${minutes}m ${seconds}s
          `;
          clearInterval(countdownInterval);
          return;
        }

        // Time is in the future (countdown)
        const absDiff = Math.abs(diff);
        const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((absDiff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((absDiff % (1000 * 60)) / 1000);

        countdownDiv.innerHTML = `
          <i class="fas fa-hourglass-half icon"></i>
          Countdown: ${days}d ${hours}h ${minutes}m ${seconds}s
        `;
      }

      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
    }

    function hitungSelisih() {
      const input = document.getElementById("datetime").value.trim();
      const timezone = document.getElementById("timezone").value;

      if (!input) {
        document.getElementById("result").innerHTML = `
          <div class="error">
            <i class="fas fa-exclamation-triangle icon"></i>Silakan masukkan tanggal dan waktu terlebih dahulu.
          </div>
        `;
        return;
      }

      // Parse input as if it's in the selected timezone
      let inputDate;
      if (timezone === "UTC") {
        // For UTC, treat input as UTC time and convert to WIB
        inputDate = new Date(input + "Z");
        // Convert UTC to WIB (+7 hours)
        inputDate = new Date(inputDate.getTime() + (7 * 60 * 60 * 1000));
      } else {
        // For other timezones, treat input as if it's in that timezone
        // Since new Date(input) always treats input as local time,
        // we need to manually construct the date in the target timezone
        
        // Parse the input string to get components
        const [datePart, timePart] = input.split('T');
        const [year, month, day] = datePart.split('-').map(Number);
        const [hour, minute, second] = timePart.split(':').map(Number);
        
        // Create date object in target timezone
        // We'll create it as if it's in UTC, then adjust
        const targetOffsets = {
          "WIB": 7,    // WIB is UTC+7
          "WITA": 8,   // WITA is UTC+8
          "WIT": 9,    // WIT is UTC+9
          "EST": -5,   // EST is UTC-5
          "PST": -8    // PST is UTC-8
        };
        
        const targetOffset = targetOffsets[timezone];
        
        // Create UTC time by subtracting the timezone offset
        const utcHour = hour - targetOffset;
        const utcDate = new Date(Date.UTC(year, month - 1, day, utcHour, minute, second));
        
        // Convert to WIB
        inputDate = new Date(utcDate.getTime() + (7 * 60 * 60 * 1000));
      }

      if (isNaN(inputDate.getTime())) {
        document.getElementById("result").innerHTML = `
          <div class="error">
            <i class="fas fa-exclamation-triangle icon"></i>Format tidak valid.
          </div>
        `;
        return;
      }

      // Get current WIB time
      const nowUTC = new Date();
      const nowWIB = new Date(nowUTC.getTime() + (7 * 60 * 60 * 1000)); // UTC+7
      
      const selisihMs = nowWIB.getTime() - inputDate.getTime();
      const isFuture = selisihMs < 0;
      
      const timezoneInfo = timezone !== "WIB" ? `
        <div class="timezone-info">
          <i class="fas fa-globe icon"></i>
          <strong>Timezone:</strong> ${timezone} → WIB
          (${timezone === "UTC" ? "UTC+0" : timezone === "WITA" ? "UTC+8" : timezone === "WIT" ? "UTC+9" : timezone === "EST" ? "UTC-5" : "UTC-8"} → UTC+7)
        </div>
      ` : '';
      
      const hasil = `
        <div class="${isFuture ? 'warning' : 'success'}">
          <i class="fas fa-${isFuture ? 'rocket' : 'history'} icon"></i>
          <strong>Selisih waktu dengan WIB sekarang:</strong>
          <div style="margin: 8px 0; font-size: 14px; font-weight: 500; line-height: 1.4;">
            ${Math.floor(Math.abs(selisihMs) / (1000 * 60 * 60 * 24))} hari, ${Math.abs(Math.floor((selisihMs / (1000 * 60 * 60)) % 24))} jam, ${Math.abs(Math.floor((selisihMs / (1000 * 60)) % 60))} menit, ${Math.abs(Math.floor((selisihMs / 1000) % 60))} detik ${isFuture ? "Di masa depan" : "Di masa lalu"}
          </div>
          ${timezoneInfo}
        </div>
      `;

      document.getElementById("result").innerHTML = hasil;
      document.getElementById("clear-buttons").style.display = "block";
    }

    function clearResults() {
      document.getElementById("result").innerHTML = "";
      document.getElementById("countdown").style.display = "none";
      document.getElementById("clear-buttons").style.display = "none";
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    async function ambilLastUpdated() {
      const usernames = ['danz', 'akuntv', 'beli', 'moklhasot', 'artemici'];
      const outputDiv = document.getElementById("api-results");

      const promises = usernames.map(async (user, index) => {
        try {
          const response = await fetch(`https://api.clashchamps.com/api/base-layouts?perPage=1&sort[]=-Date&proBuilder[]=${user}&page=1`);
          const data = await response.json();

          const lastUpdatedStr = data?.data?.[0]?.LastUpdated;
          if (lastUpdatedStr) {
            const lastUpdatedDate = new Date(lastUpdatedStr.replace(" ", "T") + "Z");
            const nowUTC = new Date();
            const selisihMs = nowUTC.getTime() - lastUpdatedDate.getTime();
            const hasil = formatSelisih(selisihMs);
            const isFuture = selisihMs < 0;

            return `<div class="${isFuture ? 'warning' : 'success'}">
              <div class="username"><i class="fas fa-user icon"></i>${user}</div>
              <div class="content">
                : ${hasil} 
                <i class="fas fa-${isFuture ? 'rocket' : 'history'} icon"></i>
                (${isFuture ? "Di masa depan" : "Di masa lalu"})
              </div>
            </div>`;
          } else {
            return `<div class="error">
              <div class="username"><i class="fas fa-user icon"></i>${user}</div>
              <div class="content">
                : <i class="fas fa-exclamation-triangle icon"></i>Tidak ada data LastUpdated.
              </div>
            </div>`;
          }
        } catch (error) {
          return `<div class="error">
            <div class="username"><i class="fas fa-user icon"></i>${user}</div>
            <div class="content">
              : <i class="fas fa-exclamation-triangle icon"></i>Gagal mengambil data (${error.message})
            </div>
          </div>`;
        }
      });

      const results = await Promise.all(promises);
      outputDiv.innerHTML = results.join("");
    }

    // Initialize on page load
    window.onload = function() {
      initDarkMode();
      setCurrentTime();
      ambilLastUpdated();
    };
  </script>
