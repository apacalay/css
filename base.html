<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>COC Link Converter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
    h2 { text-align: center; color: #333; }
    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #444;
    }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }
    textarea { font-family: monospace; min-height: 100px; }
    .checkbox-group {
      margin-top: 15px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      font-weight: 600;
      color: #444;
      gap: 8px;
    }
    button {
      background: #2d89ef;
      color: white;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: background 0.3s ease;
    }
    button:hover { background: #1b5fc6; }
    .footer-note {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 20px;
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #666;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: #2d89ef;
      border-bottom: 2px solid #2d89ef;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Clash of Clans Link Converter</h2>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('manual')">Input Manual</div>
      <div class="tab" onclick="switchTab('youtube')">Ambil dari YouTube</div>
    </div>

    <!-- TAB MANUAL -->
    <div id="tab-manual" class="tab-content active">
      <label for="judul">Judul Output:</label>
      <input type="text" id="judul" placeholder="Contoh: BEST TH14 WAR BASE">

      <label for="nomor">Nomor Awal:</label>
      <input type="number" id="nomor" value="1">

      <label for="manualSource">Link Sumber:</label>
      <input type="text" id="manualSource" placeholder="https://www.youtube.com/watch?v=xxxxxxx">

      <div class="checkbox-group">
        <label><input type="checkbox" id="hapusYT"> Hapus Link Sumber</label>
      </div>

      <label for="input">Masukkan Link-Link (satu per baris):</label>
      <textarea id="input" placeholder="Paste link YouTube redirect atau base layout di sini..."></textarea>

      <button onclick="convert()">Convert</button>
    </div>

    <!-- TAB YOUTUBE -->
    <div id="tab-youtube" class="tab-content">
      <label for="videoId">YouTube Video ID / Link:</label>
      <input type="text" id="videoId" autocomplete="off" placeholder="yqskXZ3ccXQ atau https://youtube.com/watch?v=...">

      <label for="judulYT">Judul Output:</label>
      <input type="text" id="judulYT" placeholder="(Otomatis jika kosong)">

      <label for="nomorYT">Nomor Awal:</label>
      <input type="number" id="nomorYT" value="1">

      <div class="checkbox-group">
        <label><input type="checkbox" id="hapusYTYT"> Hapus Link Sumber</label>
      </div>

      <button onclick="grabFromYouTube()">Ambil dari YouTube</button>
    </div>

    <label for="output">Hasil Output:</label>
    <textarea id="output" readonly placeholder="Hasil akan muncul di sini..."></textarea>

    <div class="footer-note">Made with ❤️</div>
  </div>

  <script>
    const apiKey = "AIzaSyCVns3Lh4xYBWNgOYeB8LQ5oMLOfL7u6Yw";

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(".tab:nth-child(" + (tab === 'manual' ? 1 : 2) + ")").classList.add("active");
      document.getElementById("tab-" + tab).classList.add("active");
    }

    function extractVideoId(raw) {
      const urlMatch = raw.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
      return urlMatch ? urlMatch[1] : raw.trim();
    }

    function cleanLinkOnly(rawLine) {
      const match = rawLine.match(/https:\/\/link\.clashofclans\.com\/[^\s]+/);
      return match ? match[0] : rawLine;
    }

    function extractRealLink(link) {
      try {
        const url = new URL(link);
        const realLink = url.searchParams.get("q");
        const videoID = url.searchParams.get("v");
        const finalLink = realLink || link;
        const ytLink = videoID ? `https://www.youtube.com/watch?v=${videoID}` : "";
        return { layoutLink: finalLink, youtubeLink: ytLink };
      } catch (e) {
        return { layoutLink: link, youtubeLink: "" };
      }
    }

    function convert() {
      const lines = document.getElementById("input").value.trim().split('\n');
      const judul = document.getElementById("judul").value.trim();
      const manualSource = document.getElementById("manualSource").value.trim();
      const hapusYT = document.getElementById("hapusYT").checked;
      let nomor = parseInt(document.getElementById("nomor").value);
      let hasil = "";

      lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        line = cleanLinkOnly(line);
        let layoutLink = "", youtubeLink = "";

        if (line.includes("youtube.com/redirect")) {
          const result = extractRealLink(line);
          layoutLink = result.layoutLink;
          youtubeLink = result.youtubeLink;
        } else if (line.includes("link.clashofclans.com")) {
          layoutLink = line;
          youtubeLink = manualSource;
        } else if (/^TH\d{2}:[A-Z]+:/.test(line)) {
          const encodedID = encodeURIComponent(line);
          layoutLink = `https://link.clashofclans.com/en?action=OpenLayout&id=${encodedID}`;
          youtubeLink = manualSource;
        } else {
          layoutLink = line;
          youtubeLink = manualSource;
        }

        if (hapusYT) youtubeLink = "";
        hasil += `${layoutLink}|||${judul}|||${nomor}.png|||${youtubeLink}\n`;
        nomor++;
      });

      document.getElementById("output").value = hasil.trim();
    }

    async function grabFromYouTube() {
      const rawInput = document.getElementById("videoId").value.trim();
      const videoId = extractVideoId(rawInput);
      const hapusYT = document.getElementById("hapusYTYT").checked;
      let nomor = parseInt(document.getElementById("nomorYT").value);
      const judulCustom = document.getElementById("judulYT").value.trim();

      if (!videoId) {
        alert("Masukkan ID atau URL video YouTube.");
        return;
      }

      const url = `https://www.googleapis.com/youtube/v3/videos?key=${apiKey}&part=snippet&id=${videoId}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const snippet = data.items[0].snippet;
        const deskripsi = snippet.description;
        const ytLink = `https://www.youtube.com/watch?v=${videoId}`;
        const title = judulCustom || snippet.title;

        const allLinks = deskripsi.match(/https:\/\/link\.clashofclans\.com\/[^\s]+/g);
        const baseLinks = allLinks ? allLinks.filter(link => link.includes("action=OpenLayout")) : [];

        if (baseLinks.length === 0) {
          alert("Tidak ditemukan link layout yang valid di deskripsi video.");
          return;
        }

        let hasil = "";
        baseLinks.forEach(link => {
          const youtubeLink = hapusYT ? "" : ytLink;
          hasil += `${link}|||${title}|||${nomor}.png|||${youtubeLink}\n`;
          nomor++;
        });

        document.getElementById("output").value = hasil.trim();
      } catch (err) {
        alert("Gagal mengambil data dari YouTube API");
      }
    }
  </script>
</body>
</html>
