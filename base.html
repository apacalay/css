<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>COC Link Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1000px;
      margin: auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideIn 0.6s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    h2 { 
      text-align: center; 
      color: #333;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow 2s ease-in-out infinite alternate;
    }
    
    @keyframes glow {
      from { 
        filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.3));
      }
      to { 
        filter: drop-shadow(0 0 15px rgba(118, 75, 162, 0.5));
      }
    }
    
    label {
      font-weight: 600;
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #555;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    
    label:hover {
      color: #667eea;
      transform: translateX(5px);
    }
    
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 15px;
      font-size: 14px;
      border: 2px solid #e1e5e9;
      border-radius: 12px;
      resize: vertical;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: rgba(255, 255, 255, 0.9);
    }
    
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    input[type="text"]:hover, input[type="number"]:hover, textarea:hover {
      border-color: #667eea;
    }
    
    #output:hover {
      border-color: rgba(102, 126, 234, 0.4);
      transform: none;
    }
    
    textarea { 
      font-family: 'Monaco', 'Menlo', monospace; 
      min-height: 120px; 
      line-height: 1.5;
    }
    
    .checkbox-group {
      margin-top: 20px;
      padding: 15px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    .checkbox-group label {
      display: flex;
      align-items: center;
      font-weight: 500;
      color: #555;
      gap: 10px;
      margin: 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .checkbox-group label:hover {
      color: #667eea;
      transform: none;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
    }
    
    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-weight: 600;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      cursor: pointer;
      margin-top: 25px;
      width: 100%;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    
    button:hover::before {
      left: 100%;
    }
    
    button:hover { 
      background: linear-gradient(135deg, #764ba2, #667eea);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }
    
    button:active {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
    
    .footer-note {
      font-size: 14px;
      color: #888;
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    .tabs {
      display: flex;
      margin-bottom: 30px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      padding: 5px;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    .tab {
      flex: 1;
      text-align: center;
      padding: 15px;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      border-radius: 8px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
      transition: left 0.3s ease;
    }
    
    .tab:hover::before {
      left: 100%;
    }
    
    .tab:hover {
      color: #667eea;
      transform: translateY(-2px);
    }
    
    .tab.active {
      color: white;
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      transform: translateY(-2px);
    }
    
    .tab-content {
      display: none;
      animation: fadeIn 0.5s ease-out;
    }
    
    .tab-content.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .output-section {
      margin-top: 30px;
      padding: 20px;
      background: rgba(102, 126, 234, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    .output-section label {
      color: #667eea;
      font-weight: 700;
      font-size: 1.1rem;
    }
    
    #output {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(102, 126, 234, 0.2);
      font-size: 13px;
      line-height: 1.6;
      cursor: text;
      transition: border-color 0.2s ease;
    }
    
    #output:hover {
      border-color: rgba(102, 126, 234, 0.4);
    }
    
    #output:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .icon {
      margin-right: 8px;
      color: #667eea;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        margin: 10px;
      }
      
      h2 {
        font-size: 2rem;
      }
      
      .tabs {
        flex-direction: column;
        gap: 5px;
      }
      
      .tab {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-crown icon"></i>Clash of Clans Link Converter</h2>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('manual')">
        <i class="fas fa-edit icon"></i>Input Manual
      </div>
      <div class="tab" onclick="switchTab('youtube')">
        <i class="fab fa-youtube icon"></i>Ambil dari YouTube
      </div>
    </div>

    <!-- TAB MANUAL -->
    <div id="tab-manual" class="tab-content active">
      <label for="judul"><i class="fas fa-heading icon"></i>Judul Output:</label>
      <input type="text" id="judul" placeholder="Contoh: BEST TH14 WAR BASE">

      <label for="nomor"><i class="fas fa-hashtag icon"></i>Nomor Awal:</label>
      <input type="number" id="nomor" value="1">

      <label for="manualSource"><i class="fas fa-link icon"></i>Link Sumber:</label>
      <input type="text" id="manualSource" placeholder="https://www.youtube.com/watch?v=xxxxxxx">

      <div class="checkbox-group">
        <label><input type="checkbox" id="hapusYT"> <i class="fas fa-trash icon"></i>Hapus Link Sumber</label>
      </div>

      <label for="input"><i class="fas fa-list icon"></i>Masukkan Link-Link (satu per baris):</label>
      <textarea id="input" placeholder="Paste link YouTube redirect atau base layout di sini..."></textarea>

      <button onclick="convert()">
        <i class="fas fa-magic icon"></i>Convert
      </button>
    </div>

    <!-- TAB YOUTUBE -->
    <div id="tab-youtube" class="tab-content">
      <label for="videoId"><i class="fab fa-youtube icon"></i>YouTube Video ID / Link:</label>
      <input type="text" id="videoId" autocomplete="off" placeholder="yqskXZ3ccXQ atau https://youtube.com/watch?v=...">

      <label for="judulYT"><i class="fas fa-heading icon"></i>Judul Output:</label>
      <input type="text" id="judulYT" placeholder="(Otomatis jika kosong)">

      <label for="nomorYT"><i class="fas fa-hashtag icon"></i>Nomor Awal:</label>
      <input type="number" id="nomorYT" value="1">

      <div class="checkbox-group">
        <label><input type="checkbox" id="hapusYTYT"> <i class="fas fa-trash icon"></i>Hapus Link Sumber</label>
      </div>

      <button onclick="grabFromYouTube()">
        <i class="fas fa-download icon"></i>Ambil dari YouTube
      </button>
    </div>

    <div class="output-section">
      <label for="output"><i class="fas fa-code icon"></i>Hasil Output:</label>
      <textarea id="output" readonly placeholder="Hasil akan muncul di sini..."></textarea>
    </div>

    <div class="footer-note">
      <i class="fas fa-heart" style="color: #e74c3c;"></i> Made with ❤️
    </div>
  </div>

  <script>
    const apiKey = "AIzaSyCVns3Lh4xYBWNgOYeB8LQ5oMLOfL7u6Yw";

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(".tab:nth-child(" + (tab === 'manual' ? 1 : 2) + ")").classList.add("active");
      document.getElementById("tab-" + tab).classList.add("active");
    }

    function extractVideoId(raw) {
      const urlMatch = raw.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
      return urlMatch ? urlMatch[1] : raw.trim();
    }

    function cleanLinkOnly(rawLine) {
      const match = rawLine.match(/https:\/\/link\.clashofclans\.com\/[^\s]+/);
      return match ? match[0] : rawLine;
    }

    function extractRealLink(link) {
      try {
        const url = new URL(link);
        const realLink = url.searchParams.get("q");
        const videoID = url.searchParams.get("v");
        const finalLink = realLink || link;
        const ytLink = videoID ? `https://www.youtube.com/watch?v=${videoID}` : "";
        return { layoutLink: finalLink, youtubeLink: ytLink };
      } catch (e) {
        return { layoutLink: link, youtubeLink: "" };
      }
    }

    function convert() {
      const lines = document.getElementById("input").value.trim().split('\n');
      const judul = document.getElementById("judul").value.trim();
      const manualSource = document.getElementById("manualSource").value.trim();
      const hapusYT = document.getElementById("hapusYT").checked;
      let nomor = parseInt(document.getElementById("nomor").value);
      let hasil = "";

      lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        line = cleanLinkOnly(line);
        let layoutLink = "", youtubeLink = "";

        if (line.includes("youtube.com/redirect")) {
          const result = extractRealLink(line);
          layoutLink = result.layoutLink;
          youtubeLink = result.youtubeLink;
        } else if (line.includes("link.clashofclans.com")) {
          layoutLink = line;
          youtubeLink = manualSource;
        } else if (/^TH\d{2}:[A-Z]+:/.test(line)) {
          const encodedID = encodeURIComponent(line);
          layoutLink = `https://link.clashofclans.com/en?action=OpenLayout&id=${encodedID}`;
          youtubeLink = manualSource;
        } else {
          layoutLink = line;
          youtubeLink = manualSource;
        }

        if (hapusYT) youtubeLink = "";
        hasil += `${layoutLink}|||${judul}|||${nomor}.png|||${youtubeLink}\n`;
        nomor++;
      });

      document.getElementById("output").value = hasil.trim();
    }

    async function grabFromYouTube() {
      const rawInput = document.getElementById("videoId").value.trim();
      const videoId = extractVideoId(rawInput);
      const hapusYT = document.getElementById("hapusYTYT").checked;
      let nomor = parseInt(document.getElementById("nomorYT").value);
      const judulCustom = document.getElementById("judulYT").value.trim();

      if (!videoId) {
        alert("Masukkan ID atau URL video YouTube.");
        return;
      }

      const url = `https://www.googleapis.com/youtube/v3/videos?key=${apiKey}&part=snippet&id=${videoId}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const snippet = data.items[0].snippet;
        const deskripsi = snippet.description;
        const ytLink = `https://www.youtube.com/watch?v=${videoId}`;
        const title = judulCustom || snippet.title;

        const allLinks = deskripsi.match(/https:\/\/link\.clashofclans\.com\/[^\s]+/g);
        const baseLinks = allLinks ? allLinks.filter(link => link.includes("action=OpenLayout")) : [];

        if (baseLinks.length === 0) {
          alert("Tidak ditemukan link layout yang valid di deskripsi video.");
          return;
        }

        let hasil = "";
        baseLinks.forEach(link => {
          const youtubeLink = hapusYT ? "" : ytLink;
          hasil += `${link}|||${title}|||${nomor}.png|||${youtubeLink}\n`;
          nomor++;
        });

        document.getElementById("output").value = hasil.trim();
      } catch (err) {
        alert("Gagal mengambil data dari YouTube API");
      }
    }
  </script>
</body>
</html>
